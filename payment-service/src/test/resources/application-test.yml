spring:
  datasource:
    url: jdbc:h2:mem:payments;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    table: payment_flyway_schema_history
  kafka:
    listener:
      auto-startup: false

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: INFO
